<!DOCTYPE html>
<html lang="pt-br">
<head>
    <title>ALPHAFIZIC - Formulário de Cadastro</title>
    <link rel="icon" href="{{ url_for('static', filename='img/loboauu.png') }}">
    <link rel="stylesheet" href="/static/css/global.css">
    <link rel="stylesheet" href="/static/css/cadastro2.css">
</head>
<body class="auth-page">

    <div class="container">
        <h1>ALPHAFIZIC</h1>

        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            {% for category, message in messages %}
              <div class="alerta alerta-{{ category }}">{{ message }}</div>
            {% endfor %}
          {% endif %}
        {% endwith %}

        <form method="POST" action="{{ url_for('cadastro2') }}">
            <input type="text" name="nome" placeholder="NOME COMPLETO" required>
            <input type="email" name="email" placeholder="E-MAIL" required>
            <input type="text" name="cpf" placeholder="CPF" required>
            <input type="tel" name="contato" placeholder="CONTATO (DDD)">
            <input type="password" name="senha" placeholder="SENHA" required>
            <button type="submit">Finalizar Cadastro</button>
        </form>

        <div style="margin-top:20px;">
            <a href="{{ url_for('login') }}" style="color:#6d6862; font-size:14px; text-decoration:none;">Já possui conta? Faça login</a>
        </div>
    </div>

</body>
</html>
